services:
  # Subdomain über die defaultRule: ntfy.rusin.xyz (die Regel unten ersetzt die Standardregel)
  ntfy:
    image: binwiederhier/ntfy:v2.11.0 # feste Version
    command: serve
    restart: unless-stopped
    user: 1000:1000
    environment:
      TZ: Europe/Berlin
    volumes:
      - ./ntfy/server.yml:/etc/ntfy/server.yml:ro
      - ${DATA_DIR:-/media/ssd/docker-container-data/kidscreentime}/ntfy:/var/cache/ntfy
    networks:
      - proxy
      - kidscreentime
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      # Von außen nur lesen (Abonnieren per JSON-Stream/WebSocket). Publishen läuft intern über http://ntfy:80.
      # Entrypoint und Zertifikat an das eigene Traefik anpassen (hier: websecure, letsencrypt).
      - traefik.http.routers.ntfy.rule=Host(`ntfy.rusin.xyz`) && (Method(`GET`) || Method(`HEAD`) || Method(`OPTIONS`))
      - traefik.http.routers.ntfy.entrypoints=websecure
      - traefik.http.routers.ntfy.tls.certresolver=letsencrypt
      - traefik.http.routers.ntfy.service=ntfy
      - traefik.http.services.ntfy.loadbalancer.server.port=80
