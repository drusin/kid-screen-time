services:
  # Der Servicename entspricht der Traefik-defaultRule: kidscreentime.rusin.xyz (die Regel steht unten explizit,
  # weil die Route eine Middleware braucht)
  kidscreentime:
    image: ghcr.io/drusin/kid-screen-time-server:1.0.0 # feste Version; zum Update hochsetzen
    restart: unless-stopped
    user: 1000:1000
    depends_on:
      - ntfy
    environment:
      TZ: Europe/Berlin # nur Logs und Container-Uhr
      # Pflichtwerte: fehlt einer, startet der Server nicht.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD in .env setzen}
      FAMILY_TIME_ZONE: Europe/Berlin # Zeitzone der Familie, unabhängig von TZ
      PUBLIC_SERVER_URL: https://kidscreentime.rusin.xyz
      NTFY_PUBLIC_URL: https://ntfy.rusin.xyz
      NTFY_INTERNAL_URL: http://ntfy:80
      DATABASE_PATH: /data/kid-screen-time.db
    volumes:
      - ${DATA_DIR:-/media/ssd/docker-container-data/kidscreentime}/server:/data
    ports:
      # Admin-Port nur als Host-Port (Heimnetz), bewusst ohne Traefik-Route:
      # http://zotacserver:8081/admin
      # Host- und Container-Port müssen gleich sein (siehe docs/betrieb.md, Bekannte Einschränkung).
      - "8081:8081"
    networks:
      - proxy
      - kidscreentime
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      # Nur der öffentliche Port 8080; der Admin-Port 8081 bekommt keine Route.
      # Entrypoint und Zertifikat an das eigene Traefik anpassen (hier: websecure, letsencrypt).
      - traefik.http.routers.kidscreentime.rule=Host(`kidscreentime.rusin.xyz`)
      - traefik.http.routers.kidscreentime.entrypoints=websecure
      - traefik.http.routers.kidscreentime.tls.certresolver=letsencrypt
      - traefik.http.routers.kidscreentime.middlewares=kidscreentime-host
      - traefik.http.routers.kidscreentime.service=kidscreentime
      - traefik.http.services.kidscreentime.loadbalancer.server.port=8080
      # Umgehung (siehe docs/betrieb.md, Bekannte Einschränkung): der Server wählt seine Routen nach dem Port im
      # Host-Header. Ohne diese Zeile liefert er hinter Traefik überall 404. Entfällt, sobald der Server das behebt.
      - traefik.http.middlewares.kidscreentime-host.headers.customrequestheaders.Host=kidscreentime:8080
