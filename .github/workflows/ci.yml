name: CI

# Gate: all JVM tests (domain, api, server, app unit/Robolectric tests incl. the architecture test)
# plus Android Lint. `./gradlew build` runs exactly that locally and here, and also assembles the
# debug/release APKs and the server fat JAR.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Install Android SDK platform (compileSdk 37.1)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1" "build-tools;36.0.0"

      - name: Build, test and lint
        run: ./gradlew build --console=plain
