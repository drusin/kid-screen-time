<title>Bildschirmzeit UI-Prototyp</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,700;8..144,900&family=Roboto+Mono:wght@500&display=swap">
<!--
  PROTOTYP, wegwerfen. Ticket: "Wie sehen Kind- und Eltern-Oberfläche aus?" (.scratch/screen-time/issues/08-ui-prototyp.md)
  Drei strukturell verschiedene Varianten pro Rolle (Kindgerät / Elterngerät), umschaltbar über die schwebende Leiste
  unten (oder ← →). Alles im Speicher, eine simulierte Uhr treibt Vorwarnung, Alarm, Überziehung und Automatischen Stopp.
  Beispieldaten: Kind "Mia", Dienstag 24.11.
-->
<style>
/* Layout: Telefonrahmen in der Mitte, Simulationspanel daneben (schmal: darunter), Variantenleiste schwebt unten. */
:root{
  --page:#E4EAEB; --surface:#F7FAFA; --card:#ECF1F1; --card2:#E1E8E9; --on:#171D1E; --muted:#56605F; --outline:#BFC8C8;
  --primary:#24666E; --on-primary:#FFFFFF; --pc:#C4E9EE; --on-pc:#002023;
  --run:#22764A; --run-c:#CBEBD6; --warn:#A35F00; --warn-c:#FFE1B8; --over:#B3261E; --over-c:#FFDAD5; --idle-c:#D3E8EA;
  --scrim:rgba(0,0,0,.38); --bar:#1E2324; --on-bar:#F1F4F4;
  --f:"Roboto Flex",Roboto,system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"Roboto Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#0B0F10; --surface:#111516; --card:#1B2122; --card2:#252C2D; --on:#DEE4E4; --muted:#A3ADAD; --outline:#3E4849;
  --primary:#86D1DA; --on-primary:#00363C; --pc:#1D4E55; --on-pc:#C4E9EE;
  --run:#7CD69E; --run-c:#123A23; --warn:#F5B860; --warn-c:#4A2D00; --over:#FFB4AA; --over-c:#5F110C; --idle-c:#163A3F;
  --scrim:rgba(0,0,0,.6); --bar:#E6EBEB; --on-bar:#111516; color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#0B0F10; --surface:#111516; --card:#1B2122; --card2:#252C2D; --on:#DEE4E4; --muted:#A3ADAD; --outline:#3E4849;
  --primary:#86D1DA; --on-primary:#00363C; --pc:#1D4E55; --on-pc:#C4E9EE;
  --run:#7CD69E; --run-c:#123A23; --warn:#F5B860; --warn-c:#4A2D00; --over:#FFB4AA; --over-c:#5F110C; --idle-c:#163A3F;
  --scrim:rgba(0,0,0,.6); --bar:#E6EBEB; --on-bar:#111516; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--page);color:var(--on);font-family:var(--f);font-size:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 120px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
button:disabled{cursor:not-allowed;opacity:.45}
.wrap{display:flex;gap:24px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
.phone{width:100%;max-width:392px;height:min(820px,calc(100dvh - 150px));min-height:640px;background:var(--surface);border-radius:36px;border:8px solid var(--bar);position:relative;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.18)}
.statusbar{display:flex;justify-content:space-between;padding:8px 22px 4px;font-size:12px;font-weight:500;flex:none}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.scroll{flex:1;min-height:0;overflow-y:auto}
.side{width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h2{margin:0;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.panel p{margin:0;color:var(--muted);line-height:1.45}
.prow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.clock{font-family:var(--mono);font-size:28px}
.tog{padding:7px 12px;border-radius:10px;border:1px solid var(--outline);font-weight:500}
.tog.on{background:var(--pc);color:var(--on-pc);border-color:transparent}
/* Variantenleiste */
.proto{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--bar);color:var(--on-bar);border-radius:999px;display:flex;align-items:center;gap:4px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:50;max-width:calc(100vw - 24px)}
.proto button{width:36px;height:36px;border-radius:50%;font-size:18px;color:var(--on-bar)}
.proto .lbl{padding:0 8px;font-weight:500;white-space:nowrap;font-size:13px;overflow:hidden;text-overflow:ellipsis}
.proto .role{width:auto;padding:0 12px;border-radius:999px;border:1px solid currentColor;font-size:12px;height:30px}
/* Gemeinsame M3-Bausteine */
.appbar{display:flex;align-items:center;gap:8px;padding:10px 16px;min-height:56px;flex:none}
.appbar .t{font-size:22px;font-weight:500;flex:1}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px}
.ib:hover{background:var(--card2)}
.card{background:var(--card);border-radius:16px;padding:16px}
.btn{height:40px;padding:0 20px;border-radius:999px;background:var(--primary);color:var(--on-primary);font-weight:500}
.btn.tonal{background:var(--pc);color:var(--on-pc)}
.btn.text{background:none;color:var(--primary);padding:0 12px}
.btn.outl{background:none;border:1px solid var(--outline);color:var(--primary)}
.chip{height:34px;padding:0 14px;border-radius:10px;border:1px solid var(--outline);font-weight:500;font-variant-numeric:tabular-nums}
.chip:hover{background:var(--card2)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:56px}
.li .m{flex:1;min-width:0}
.li .a{font-weight:500}
.li .b{color:var(--muted);font-size:13px;margin-top:2px}
.sec{padding:18px 16px 6px;font-size:14px;font-weight:500;color:var(--primary)}
.num{font-variant-numeric:tabular-nums}
.banner{margin:0 16px 8px;padding:10px 14px;border-radius:12px;display:flex;gap:10px;align-items:center;font-weight:500;text-align:left;width:calc(100% - 32px)}
.banner.err{background:var(--over-c);color:var(--over)}
.banner.off{background:var(--card2);color:var(--muted)}
.navbar{display:flex;background:var(--card);flex:none;padding:10px 0 14px}
.navbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:500;color:var(--muted)}
.navbar .pill{width:56px;height:30px;border-radius:15px;display:grid;place-items:center;font-size:17px}
.navbar .on{color:var(--on)} .navbar .on .pill{background:var(--pc);color:var(--on-pc)}
.tabs{display:flex;border-bottom:1px solid var(--outline);flex:none}
.tabs button{flex:1;padding:14px 0;font-weight:500;color:var(--muted);border-bottom:3px solid transparent}
.tabs .on{color:var(--primary);border-color:var(--primary)}
.step{display:flex;align-items:center;gap:6px}
.step button{width:36px;height:36px;border-radius:50%;border:1px solid var(--outline);font-size:18px}
.step .v{min-width:64px;text-align:center;font-weight:500}
.fab{position:absolute;right:16px;bottom:16px;height:56px;padding:0 20px;border-radius:16px;background:var(--pc);color:var(--on-pc);font-weight:500;display:flex;align-items:center;gap:8px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.sheetwrap{position:absolute;inset:0;background:var(--scrim);display:flex;align-items:flex-end;z-index:20}
.sheet{background:var(--surface);width:100%;border-radius:28px 28px 0 0;padding:12px 20px 24px;display:flex;flex-direction:column;gap:14px;max-height:92%;overflow-y:auto}
.sheet .grab{width:32px;height:4px;border-radius:2px;background:var(--outline);align-self:center}
.sheet h3{margin:0;font-size:22px;font-weight:500}
.hint{color:var(--muted);font-size:13px;line-height:1.4}
.notif{position:absolute;top:6px;left:8px;right:8px;background:var(--card2);border-radius:20px;padding:12px 14px;z-index:30;box-shadow:0 6px 18px rgba(0,0,0,.25);display:flex;gap:12px;align-items:flex-start}
.notif .ic{width:32px;height:32px;border-radius:50%;background:var(--over);color:var(--surface);display:grid;place-items:center;flex:none;font-weight:900}
.snack{position:absolute;left:16px;right:16px;bottom:100px;background:var(--bar);color:var(--on-bar);padding:14px 16px;border-radius:8px;z-index:25;font-weight:500}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.tag{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--card2);color:var(--muted);font-weight:500}
.tag.over{background:var(--over-c);color:var(--over)}
.tag.run{background:var(--run-c);color:var(--run)}
/* Zustandsfarben Kindgerät */
.st-idle{--sc:var(--primary);--scc:var(--idle-c)} .st-run{--sc:var(--run);--scc:var(--run-c)} .st-warn{--sc:var(--warn);--scc:var(--warn-c)}
.st-over{--sc:var(--over);--scc:var(--over-c)} .st-empty{--sc:var(--muted);--scc:var(--card2)}
/* Kind A: Ring */
.kA{flex:1;display:flex;flex-direction:column;align-items:center;gap:18px;padding:8px 24px 28px}
.kA .ringbox{position:relative;width:min(270px,70vw);aspect-ratio:1;max-width:100%;margin-top:8px}
.kA svg{width:100%;height:100%;transform:rotate(-90deg)}
.kA .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.kA .lab{font-size:15px;font-weight:500;color:var(--sc)}
.kA .big{font-size:60px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--on)}
.kA .sub{color:var(--muted)}
.kA .quota{text-align:center;line-height:1.5}
.kA .quota b{font-size:18px}
.kA .go{margin-top:auto;width:100%;height:72px;border-radius:36px;font-size:22px;font-weight:700;background:var(--sc);color:var(--surface)}
.st-over .ringtrack{animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.35}}
/* Kind B: Vollfläche */
.kB{flex:1;display:flex;flex-direction:column;background:var(--scc);transition:background .4s}
.kB .top{display:flex;justify-content:space-between;padding:6px 20px;font-weight:500;color:var(--sc)}
.kB .mid{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;padding:0 16px;text-align:center}
.kB .word{font-size:26px;font-weight:900;color:var(--sc);text-transform:uppercase;letter-spacing:.06em}
.kB .huge{font-size:96px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1;color:var(--on)}
.kB .go{height:42%;min-height:190px;border-radius:40px 40px 0 0;background:var(--sc);color:var(--surface);font-size:52px;font-weight:900;letter-spacing:.04em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.kB .go small{font-size:15px;font-weight:500;letter-spacing:0;opacity:.85}
/* Kind C: Tank + Liste */
.kC{flex:1;display:flex;gap:16px;padding:4px 16px 96px;min-height:0}
.kC .tank{width:76px;border-radius:24px;background:var(--card2);position:relative;overflow:hidden;flex:none}
.kC .fill{position:absolute;left:0;right:0;bottom:0;background:var(--sc);transition:height .3s}
.kC .tank .lvl{position:absolute;inset:auto 0 10px;text-align:center;font-weight:700;color:var(--surface);font-size:13px;z-index:1;mix-blend-mode:normal}
.kC .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px;overflow-y:auto}
.kC .rem{font-size:52px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--sc);line-height:1}
.kC .row{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--outline)}
.kC .fab{left:16px;right:16px;justify-content:center;font-size:18px;background:var(--sc);color:var(--surface)}
/* Alarm-Vollbild */
.alarm{position:absolute;inset:0;background:var(--over);color:var(--surface);z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
.alarm .bell{font-size:64px;animation:ring .5s infinite alternate}
@keyframes ring{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.alarm h1{margin:0;font-size:40px;font-weight:900}
.alarm .ov{font-family:var(--mono);font-size:22px}
.alarm .b1{width:100%;height:64px;border-radius:32px;background:var(--surface);color:var(--over);font-size:20px;font-weight:700;margin-top:24px}
.alarm .b2{color:var(--surface);text-decoration:underline;font-weight:500}
/* Eltern */
.hero{margin:0 16px;border-radius:24px;padding:18px;background:var(--scc);display:flex;flex-direction:column;gap:10px}
.hero .r1{display:flex;justify-content:space-between;align-items:center}
.hero .who{font-size:18px;font-weight:500}
.hero .bigt{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--sc);line-height:1}
.bar{height:10px;border-radius:5px;background:var(--surface);overflow:hidden}
.bar i{display:block;height:100%;background:var(--sc)}
.qr{width:200px;height:200px;align-self:center;background:#fff;padding:10px;border-radius:12px}
.code{font-family:var(--mono);font-size:28px;text-align:center;letter-spacing:.12em}
.kidcard{margin:0 16px;border-radius:24px;padding:18px;display:flex;gap:16px;align-items:center;text-align:left;width:calc(100% - 32px)}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-size:24px;font-weight:700;flex:none}
.dash{border:2px dashed var(--outline);color:var(--muted);background:none}
.menu{position:absolute;top:52px;right:12px;background:var(--card2);border-radius:8px;padding:6px 0;z-index:25;box-shadow:0 6px 18px rgba(0,0,0,.25);min-width:200px}
.menu button{display:block;width:100%;text-align:left;padding:12px 16px}
.slider{width:100%;accent-color:var(--primary)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{height:52px;border-radius:14px;background:var(--card);font-size:18px;font-weight:500}
.offlinebar{background:var(--card2);color:var(--muted);text-align:center;padding:6px;font-size:13px;font-weight:500;flex:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <div class="phone" id="phone"></div>
  <div class="side" id="side"></div>
</div>
<div class="proto" id="proto"></div>

<script>
const DAYS=['Mo','Di','Mi','Do','Fr','Sa','So'], DAYL=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
const VARS={kind:[['A','Ring'],['B','Vollfläche'],['C','Tank + Liste']],eltern:[['A','Tabs unten'],['B','Ein Bildschirm'],['C','Kind-Hub']]};
const S={
  role:'kind', v:{kind:'A',eltern:'A'},
  template:[60,60,60,60,90,120,120], todayIdx:1, templateAtMidnight:60,
  adj:[{min:15,at:14*60+2}],
  sessions:[{s:7*60+10,e:7*60+35,auto:false},{s:13*60,e:13*60+25,auto:false}],
  running:null, now:15*60+40, speed:1, warnTh:5, overLim:60,
  warned:false, nextAlarm:null, alarmOn:false, offline:false, offlineSince:15*60+32, setupMissing:false,
  pScreen:'heute', kidOpen:false, sheet:null, menu:false, notif:null, snack:null, customAdj:10, padVal:'', pairRole:null, pairT:600,
  kScreen:'main', chk:{},
  devices:[{id:1,name:'Galaxy Tab A9 (Mia)',role:'kind',since:'18.11.',seen:'gerade eben'},{id:2,name:'Pixel 8 (dieses Gerät)',role:'eltern',since:'17.11.',seen:'gerade eben',self:true},{id:3,name:'Galaxy S23',role:'eltern',since:'17.11.',seen:'vor 2 Std'}],
};
const HIST=[
  {d:'Mo 23.11.',q:60,sess:[[7*60+5,7*60+30,0],[15*60,15*60+45,0]],adj:[]},
  {d:'So 22.11.',q:135,sess:[[9*60,10*60+30,0],[16*60,17*60+40,1]],adj:[15]},
  {d:'Sa 21.11.',q:120,sess:[[8*60+30,9*60+50,0],[14*60,14*60+20,0]],adj:[]},
  {d:'Fr 20.11.',q:90,sess:[[15*60+10,16*60+30,0]],adj:[]},
];
const $=s=>document.querySelector(s);
const hm=m=>{m=((Math.floor(m)%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const mmss=min=>{const t=Math.max(0,Math.round(Math.abs(min)*60));const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0')};
const minTxt=m=>{m=Math.round(m);if(Math.abs(m)<60)return m+' min';const h=Math.floor(Math.abs(m)/60),r=Math.abs(m)%60;return (m<0?'−':'')+h+' Std'+(r?' '+r+' min':'')};
const sumAdj=()=>S.adj.reduce((a,x)=>a+x.min,0);
const quota=()=>Math.max(0,S.templateAtMidnight+sumAdj());
const usedDone=()=>S.sessions.reduce((a,x)=>a+(x.e-x.s),0);
const elapsed=()=>S.running?S.now-S.running.s:0;
const rem=()=>quota()-usedDone()-elapsed();
function st(){const r=rem();if(S.running)return r>S.warnTh?'run':r>0?'warn':'over';return r>0?'idle':'empty'}
const stWord={idle:'übrig',run:'läuft',warn:'gleich vorbei',over:'Zeit ist um',empty:'aufgebraucht'};

function start(){if(rem()<=0)return;S.running={s:S.now};S.warned=false;S.nextAlarm=null;check();render()}
function stop(auto){if(!S.running)return;S.sessions.push({s:S.running.s,e:S.now,auto:!!auto});S.running=null;S.nextAlarm=null;S.alarmOn=false;S.warned=false;render()}
function notify(t,b){S.notif={t,b,until:Date.now()+7000}}
function check(){
  if(!S.running)return;const r=rem();
  if(r<=S.warnTh&&r>0&&!S.warned){S.warned=true;S.snack={t:'Vorwarnung: noch '+Math.ceil(r)+' Minuten',until:Date.now()+4000}}
  if(r<=0){
    if(S.nextAlarm===null||S.now>=S.nextAlarm){S.nextAlarm=S.now+5;S.alarmOn=true;S.warned=true;notify('Mia: Zeit ist um','Sitzung läuft seit '+hm(S.running.s)+(r<-0.5?' · '+minTxt(-r)+' Überziehung':''));}
    if(-r>=S.overLim){stop(true);notify('Mia: Automatisch gestoppt','Überziehung hat '+S.overLim+' min erreicht.')}
  } else if(S.nextAlarm!==null){S.nextAlarm=null;S.alarmOn=false}
}
function addAdj(m){if(S.offline||!m)return;S.adj.push({min:m,at:S.now});S.sheet=null;S.padVal='';check();render()}

/* ---------- Kindgerät ---------- */
function kidBanners(){let h='';
  if(S.setupMissing)h+=`<button class="banner err" data-act="kchk"><span>⚠</span><span>Einrichtung unvollständig: Der Alarm klingelt vielleicht nicht. Antippen.</span></button>`;
  if(S.offline)h+=`<div class="banner off">Offline · gerechnet mit dem Stand von ${hm(S.offlineSince)}</div>`;return h}
function quotaLine(){const a=sumAdj();return `Heute ${quota()} min`+(a?` <span class="hint">(${S.templateAtMidnight} ${a>0?'+ '+a+' Bonus':'− '+(-a)})</span>`:'')}
function btnLabel(s){return S.running?'Stopp':s==='empty'?'Keine Zeit mehr übrig':'Start'}
function kidA(){const s=st(),q=quota(),r=rem(),frac=q?Math.max(0,Math.min(1,r/q)):0,C=2*Math.PI*44;
  const over=s==='over';
  return `<div class="appbar"><span class="t">Hallo Mia</span>${S.setupMissing?'':`<button class="ib" data-act="kchk" title="Einrichtung">✓</button>`}</div>${kidBanners()}
  <div class="kA st-${s}"><div class="ringbox"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="var(--card2)" stroke-width="8"/>
  <circle class="ringtrack" cx="50" cy="50" r="44" fill="none" stroke="var(--sc)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${over?C:C*frac} ${C}"/></svg>
  <div class="in"><span class="lab">${over?'drüber':stWord[s]}</span><span class="big">${over?'+'+mmss(r):mmss(r)}</span><span class="sub">${S.running?'seit '+hm(S.running.s):'noch heute'}</span></div></div>
  <div class="quota"><b class="num">${quotaLine()}</b><br><span class="hint">Schon geschaut: ${minTxt(usedDone()+elapsed())}</span></div>
  <button class="go" data-act="toggle" ${!S.running&&s==='empty'?'disabled':''}>${btnLabel(s)}</button></div>`}
function kidB(){const s=st(),r=rem();
  return `<div class="kB st-${s}"><div class="top"><span>Mia</span><span class="num">${quotaLine()}</span></div>${kidBanners()}
  <div class="mid"><span class="word">${stWord[s]}</span><span class="huge">${s==='over'?'+':''}${mmss(r)}</span>
  <span class="hint">${S.running?'Läuft seit '+hm(S.running.s):s==='empty'?'Morgen gibt es neue Zeit':'Tippe auf Los, wenn du anfängst'}</span></div>
  <button class="go" data-act="toggle" ${!S.running&&s==='empty'?'disabled':''}>${S.running?'STOPP':s==='empty'?'—':'LOS'}<small>${S.running?'Ich bin fertig':s==='empty'?'Heute keine Zeit mehr':'Bildschirmzeit starten'}</small></button></div>`}
function kidC(){const s=st(),q=quota(),r=rem(),frac=q?Math.max(0,Math.min(1,r/q)):0;
  const rows=[...S.sessions.map(x=>({t:x.s,h:`<span>${hm(x.s)}–${hm(x.e)}</span><span class="num">${minTxt(x.e-x.s)}</span>`})),
    ...S.adj.map(a=>({t:a.at,h:`<span>${hm(a.at)} ${a.min>0?'Bonus':'Abzug'}</span><span class="num" style="color:${a.min>0?'var(--run)':'var(--over)'}">${a.min>0?'+':'−'}${Math.abs(a.min)} min</span>`}))];
  if(S.running)rows.push({t:S.running.s,h:`<span>${hm(S.running.s)}–jetzt</span><span class="tag run">läuft</span>`});
  rows.sort((a,b)=>a.t-b.t);
  return `<div class="appbar"><span class="t">Meine Zeit</span>${S.setupMissing?'':`<button class="ib" data-act="kchk" title="Einrichtung">✓</button>`}</div>${kidBanners()}
  <div class="kC st-${s}"><div class="tank"><div class="fill" style="height:${s==='over'?100:frac*100}%"></div><span class="lvl">${s==='over'?'leer':Math.round(frac*100)+' %'}</span></div>
  <div class="info"><div><div class="hint">${s==='over'?'Überziehung':'Noch übrig'}</div><div class="rem">${s==='over'?'+':''}${mmss(r)}</div></div>
  <div class="num" style="font-weight:500">${quotaLine()}</div>
  <div><div class="hint" style="margin-bottom:4px">Heute</div>${rows.map(x=>`<div class="row">${x.h}</div>`).join('')}
  <div class="row"><span>Wochenvorlage ${DAYS[S.todayIdx]}</span><span class="num">${S.templateAtMidnight} min</span></div></div></div>
  <button class="fab" data-act="toggle" ${!S.running&&s==='empty'?'disabled':''}>${S.running?'■ Stopp':s==='empty'?'Keine Zeit mehr übrig':'▶ Start'}</button></div>`}
function kidChecklist(){const items=[['Exakte Alarme erlaubt',!S.setupMissing],['Vollbild-Benachrichtigungen erlaubt',true],['Benachrichtigungen an',true],['Akku: Nicht eingeschränkt',!S.setupMissing],['Alarmlautstärke über 0',true],['ntfy verbunden (Push vom Server)',true]];
  return `<div class="appbar"><button class="ib" data-act="kback">←</button><span class="t">Einrichtung</span></div><div class="scroll"><div class="list">
  ${items.map(([t,ok])=>`<div class="li"><span class="dot" style="background:${ok?'var(--run)':'var(--over)'}"></span><div class="m"><div class="a">${t}</div>${ok?'':'<div class="b" style="color:var(--over)">Fehlt. Antippen öffnet die Systemeinstellung.</div>'}</div>${ok?'✓':'<button class="btn tonal">Öffnen</button>'}</div>`).join('')}
  <div class="sec">Bitte selbst prüfen</div>
  <label class="li"><input type="checkbox" id="chk1" data-chk="1" ${S.chk[1]?'checked':''}><div class="m"><div class="a">„Nie schlafende Apps“ enthält diese App</div><div class="b">Einstellungen › Akku › Hintergrundnutzungslimits</div></div></label>
  <label class="li"><input type="checkbox" id="chk2" data-chk="2" ${S.chk[2]?'checked':''}><div class="m"><div class="a">Alarme bei „Nicht stören“ erlaubt</div><div class="b">Einstellungen › Benachrichtigungen › Nicht stören</div></div></label>
  </div><p class="hint" style="padding:8px 16px">Diese Liste wird bei jedem App-Start geprüft.</p></div>`}

/* ---------- Elterngerät: Bausteine ---------- */
function hero(){const s=st(),q=quota(),r=rem(),u=usedDone()+elapsed();
  return `<div class="hero st-${s}"><div class="r1"><span class="who">Mia</span><span class="tag ${s==='over'?'over':S.running?'run':''}">${S.running?(s==='over'?'Überziehung':'Sitzung läuft seit '+hm(S.running.s)):'keine Sitzung'}</span></div>
  <div><span class="bigt">${s==='over'?'+':''}${mmss(r)}</span> <span class="hint">${s==='over'?'drüber':'übrig'}</span></div>
  <div class="bar"><i style="width:${q?Math.min(100,u/q*100):100}%"></i></div>
  <div class="hint num">${minTxt(u)} von ${minTxt(q)} genutzt · Vorlage ${DAYS[S.todayIdx]} ${S.templateAtMidnight} min${sumAdj()?' '+(sumAdj()>0?'+':'−')+' '+Math.abs(sumAdj())+' Anpassung':''}</div>
  ${S.offline?`<div class="hint">Stand des Kindgeräts unbekannt seit ${hm(S.offlineSince)}</div>`:''}</div>`}
function adjChips(){const d=S.offline?'disabled':'';return `<div class="prow" style="padding:0 16px">${[-15,-5,5,15,30].map(m=>`<button class="chip" ${d} data-act="adj" data-m="${m}">${m>0?'+':'−'}${Math.abs(m)}</button>`).join('')}<button class="chip" ${d} data-act="sheet" data-s="adj">Andere…</button></div>`}
function adjList(){if(!S.adj.length)return '<p class="hint" style="padding:0 16px">Heute noch keine Tagesanpassung.</p>';
  return `<div class="list">${S.adj.map((a,i)=>`<div class="li"><div class="m"><div class="a num">${a.min>0?'+':'−'}${Math.abs(a.min)} min</div><div class="b">${hm(a.at)}${a.undo?' · Gegenbuchung':''}</div></div>${a.undo||a.undone?'':`<button class="btn text" ${S.offline?'disabled':''} data-act="undo" data-i="${i}">Zurücknehmen</button>`}</div>`).join('')}</div>`}
function weekEditor(){const d=S.offline?'disabled':'';
  return `<div class="list">${S.template.map((m,i)=>`<div class="li"><div class="m"><div class="a">${DAYL[i]}</div>${i===S.todayIdx&&m!==S.templateAtMidnight?`<div class="b">Heute gilt noch ${S.templateAtMidnight} min, neu ab nächstem ${DAYL[i]}</div>`:''}</div><div class="step"><button ${d} data-act="tpl" data-i="${i}" data-d="-15">−</button><span class="v num">${minTxt(m)}</span><button ${d} data-act="tpl" data-i="${i}" data-d="15">+</button></div></div>`).join('')}</div>
  <p class="hint" style="padding:0 16px">Änderungen werden sofort gespeichert und gelten ab morgen. Für heute: Tagesanpassung.</p>`}
function rules(){const d=S.offline?'disabled':'';
  return `<div class="list"><div class="li"><div class="m"><div class="a">Vorwarnung</div><div class="b">so lange vor Ablauf</div></div><div class="step"><button ${d} data-act="rule" data-k="warnTh" data-d="-1">−</button><span class="v num">${S.warnTh} min</span><button ${d} data-act="rule" data-k="warnTh" data-d="1">+</button></div></div>
  <div class="li"><div class="m"><div class="a">Automatischer Stopp</div><div class="b">nach so viel Überziehung</div></div><div class="step"><button ${d} data-act="rule" data-k="overLim" data-d="-15">−</button><span class="v num">${S.overLim} min</span><button ${d} data-act="rule" data-k="overLim" data-d="15">+</button></div></div></div>`}
function histView(){const today={d:'Heute, Di 24.11.',q:quota(),sess:[...S.sessions.map(x=>[x.s,x.e,x.auto?1:0]),...(S.running?[[S.running.s,S.now,2]]:[])],adj:S.adj.map(a=>a.min)};
  return [today,...HIST].map(h=>{const u=h.sess.reduce((a,x)=>a+x[1]-x[0],0),o=u-h.q;
    return `<div class="sec" style="display:flex;justify-content:space-between;color:var(--on)"><span>${h.d}</span><span class="num">${minTxt(u)} / ${minTxt(h.q)} ${o>0?`<span class="tag over">+${minTxt(o)}</span>`:''}</span></div>
    <div class="list">${h.sess.map(x=>`<div class="li" style="min-height:40px;padding-block:6px"><div class="m num">${hm(x[0])}–${x[2]===2?'jetzt':hm(x[1])}</div>${x[2]===1?'<span class="tag over">Automatisch gestoppt</span>':x[2]===2?'<span class="tag run">läuft</span>':''}<span class="num">${minTxt(x[1]-x[0])}</span></div>`).join('')}
    ${h.adj.length?`<div class="li hint" style="min-height:32px;padding-block:4px">Tagesanpassungen: ${h.adj.map(a=>(a>0?'+':'−')+Math.abs(a)).join(', ')} min</div>`:''}</div>`}).join('')}
function devices(){const parents=S.devices.filter(x=>x.role==='eltern').length;
  return `<div class="list">${S.devices.map(x=>`<div class="li"><div class="avatar" style="width:40px;height:40px;font-size:16px;background:${x.role==='kind'?'var(--run)':'var(--primary)'}">${x.role==='kind'?'K':'E'}</div><div class="m"><div class="a">${x.name}</div><div class="b">${x.role==='kind'?'Kindgerät für Mia':'Elterngerät'} · gekoppelt ${x.since} · zuletzt ${x.role==='kind'&&S.offline?'um '+hm(S.offlineSince):x.seen}</div></div>
  ${x.role==='eltern'&&parents<=1?'<span class="hint">letztes</span>':`<button class="btn text" ${S.offline?'disabled':''} data-act="unpair" data-id="${x.id}">Entkoppeln</button>`}</div>`).join('')}</div>`}
function pairBtn(){return `<button class="btn tonal" style="margin:8px 16px" ${S.offline?'disabled':''} data-act="sheet" data-s="pair">Gerät koppeln</button>`}
function offlineBar(){return S.offline?`<div class="offlinebar">Offline · nur Ansicht · Stand von ${hm(S.offlineSince)}</div>`:''}

/* Eltern A: Tabs unten */
function parA(){const tabs=[['heute','Heute','◷'],['woche','Woche','▦'],['verlauf','Verlauf','☰'],['geraete','Geräte','⌁']];
  const titles={heute:'Heute',woche:'Wochenvorlage',verlauf:'Verlauf',geraete:'Geräte'};
  let body='';
  if(S.pScreen==='heute')body=`${hero()}<div class="sec">Tagesanpassung für heute</div>${adjChips()}<div style="height:8px"></div>${adjList()}`;
  if(S.pScreen==='woche')body=`${weekEditor()}<div class="sec">Regeln</div>${rules()}`;
  if(S.pScreen==='verlauf')body=histView();
  if(S.pScreen==='geraete')body=`${devices()}${pairBtn()}`;
  return `${offlineBar()}<div class="appbar"><span class="t">${titles[S.pScreen]}</span></div><div class="scroll">${body}<div style="height:24px"></div></div>
  <nav class="navbar">${tabs.map(([k,l,i])=>`<button class="${S.pScreen===k?'on':''}" data-act="pnav" data-s="${k}"><span class="pill">${i}</span>${l}</button>`).join('')}</nav>`}
/* Eltern B: Ein Bildschirm */
function lastUndoable(){for(let i=S.adj.length-1;i>=0;i--)if(!S.adj[i].undo&&!S.adj[i].undone)return i;return -1}
function parB(){const d=S.offline?'disabled':'';
  if(S.pScreen==='woche')return `${offlineBar()}<div class="appbar"><button class="ib" data-act="pnav" data-s="heute">✕</button><span class="t">Wochenvorlage</span></div><div class="scroll">${weekEditor()}</div>`;
  if(S.pScreen==='einst')return `${offlineBar()}<div class="appbar"><button class="ib" data-act="pnav" data-s="heute">←</button><span class="t">Einstellungen</span></div><div class="scroll"><div class="sec">Regeln</div>${rules()}<div class="sec">Geräte</div>${devices()}${pairBtn()}</div>`;
  if(S.pScreen==='verlauf')return `${offlineBar()}<div class="appbar"><button class="ib" data-act="pnav" data-s="heute">←</button><span class="t">Verlauf</span></div><div class="scroll">${histView()}</div>`;
  const preview=quota()+S.customAdj;
  return `${offlineBar()}<div class="appbar"><span class="t">Bildschirmzeit</span><button class="ib" data-act="menu">⋮</button></div>
  ${S.menu?`<div class="menu"><button data-act="pnav" data-s="einst">Einstellungen &amp; Geräte</button><button data-act="pnav" data-s="verlauf">Ganzer Verlauf</button></div>`:''}
  <div class="scroll">${hero()}
  <div class="card" style="margin:12px 16px;display:flex;flex-direction:column;gap:10px"><div style="font-weight:500">Heute anpassen</div>
   <div class="step" style="justify-content:space-between"><button ${d} data-act="cadj" data-d="-5">−</button><span class="v num" style="font-size:24px">${S.customAdj>0?'+':S.customAdj<0?'−':''}${Math.abs(S.customAdj)} min</span><button ${d} data-act="cadj" data-d="5">+</button></div>
   <div class="hint num">Danach: Tageskontingent ${Math.max(0,preview)} min</div>
   <button class="btn" ${d||(!S.customAdj?'disabled':'')} data-act="adj" data-m="${S.customAdj}">Buchen</button>
   ${lastUndoable()>=0?`<div class="hint">Heute gebucht: ${S.adj.map(a=>(a.min>0?'+':'−')+Math.abs(a.min)).join(', ')} min · <button class="btn text" style="height:auto;padding:0" ${d} data-act="undo" data-i="${lastUndoable()}">letzte zurücknehmen</button></div>`:''}</div>
  <button class="li card" style="margin:0 16px;width:calc(100% - 32px);text-align:left" data-act="pnav" data-s="woche"><div class="m"><div class="a">Wochenvorlage</div><div class="b num">${S.template.map((m,i)=>DAYS[i]+' '+m).join(' · ')}</div></div>›</button>
  <div class="sec">Letzte Tage</div>${histView().split('<div class="sec"').slice(0,3).join('<div class="sec"')}
  <button class="btn text" style="margin:0 8px" data-act="pnav" data-s="verlauf">Ganzer Verlauf</button><div style="height:24px"></div></div>`}
/* Eltern C: Kind-Hub */
function parC(){
  if(S.pScreen==='geraete')return `${offlineBar()}<div class="appbar"><button class="ib" data-act="pnav" data-s="heute">←</button><span class="t">Geräte</span></div><div class="scroll">${devices()}${pairBtn()}</div>`;
  if(!S.kidOpen){const s=st(),r=rem();
    return `${offlineBar()}<div class="appbar"><span class="t">Familie</span><button class="ib" data-act="pnav" data-s="geraete" title="Geräte">⌁</button></div><div class="scroll" style="display:flex;flex-direction:column;gap:12px">
    <button class="kidcard st-${s}" style="background:var(--scc)" data-act="kid"><div class="avatar">M</div><div class="m" style="flex:1"><div style="font-size:20px;font-weight:500">Mia</div><div class="num" style="color:var(--sc);font-weight:700;font-size:28px">${s==='over'?'+':''}${mmss(r)}</div><div class="hint">${S.running?(s==='over'?'Überziehung · ':'')+'läuft seit '+hm(S.running.s):stWord[s]+' von '+quota()+' min'}</div></div>›</button>
    <button class="kidcard dash" disabled><div class="avatar" style="background:var(--card2);color:var(--muted)">+</div><div>Weiteres Kind (später)</div></button></div>`}
  const t=S.pScreen==='heute'||S.pScreen==='geraete'?'heute':S.pScreen;
  let body='';
  if(t==='heute')body=`<div style="height:12px"></div>${hero()}<div class="sec">Tagesanpassungen</div>${adjList()}<div style="height:90px"></div>`;
  if(t==='woche')body=`${weekEditor()}<div class="sec">Regeln für Mia</div>${rules()}`;
  if(t==='verlauf')body=histView();
  return `${offlineBar()}<div class="appbar"><button class="ib" data-act="kidback">←</button><div class="avatar" style="width:36px;height:36px;font-size:16px">M</div><span class="t">Mia</span></div>
  <div class="tabs">${[['heute','Heute'],['woche','Woche'],['verlauf','Verlauf']].map(([k,l])=>`<button class="${t===k?'on':''}" data-act="pnav" data-s="${k}">${l}</button>`).join('')}</div>
  <div class="scroll">${body}</div>${t==='heute'?`<button class="fab" ${S.offline?'disabled':''} data-act="sheet" data-s="pad">± Zeit anpassen</button>`:''}`}

/* Sheets */
function qrSvg(){let x=1234567,c='';const rnd=()=>(x=(x*16807)%2147483647)/2147483647;const n=25,fin=(r,cc)=>(r<7&&cc<7)||(r<7&&cc>=n-7)||(r>=n-7&&cc<7);
  for(let r=0;r<n;r++)for(let k=0;k<n;k++){let on;if(fin(r,k)){const rr=r<7?r:r-(n-7),kk=k<7?k:k-(n-7);on=rr===0||rr===6||kk===0||kk===6||(rr>1&&rr<5&&kk>1&&kk<5)}else on=rnd()>.5;if(on)c+=`<rect x="${k}" y="${r}" width="1" height="1"/>`}
  return `<svg class="qr" viewBox="0 0 ${n} ${n}" fill="#111" shape-rendering="crispEdges">${c}</svg>`}
function sheet(){if(!S.sheet)return '';let h='';
  if(S.sheet==='adj')h=`<h3>Tagesanpassung</h3><p class="hint">Gilt nur für heute und sofort.</p><div class="step" style="justify-content:center"><button data-act="cadj" data-d="-5">−</button><span class="v num" style="font-size:28px;min-width:110px">${S.customAdj>0?'+':S.customAdj<0?'−':''}${Math.abs(S.customAdj)} min</span><button data-act="cadj" data-d="5">+</button></div><div class="hint num" style="text-align:center">Tageskontingent danach: ${Math.max(0,quota()+S.customAdj)} min</div><div class="prow" style="justify-content:flex-end"><button class="btn text" data-act="close">Abbrechen</button><button class="btn" ${S.customAdj?'':'disabled'} data-act="adj" data-m="${S.customAdj}">Buchen</button></div>`;
  if(S.sheet==='pad'){const v=parseInt(S.padVal||'0',10);
    h=`<h3>Zeit für heute anpassen</h3><div class="code num">${S.padVal||'0'} min</div><div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-act="padk" data-k="${n}">${n}</button>`).join('')}<button data-act="padk" data-k="C">C</button><button data-act="padk" data-k="0">0</button><button data-act="padk" data-k="B">⌫</button></div>
    <div class="hint num" style="text-align:center">Jetzt ${quota()} min · mit +${v}: ${quota()+v} · mit −${v}: ${Math.max(0,quota()-v)}</div>
    <div class="prow"><button class="btn outl" style="flex:1" ${v?'':'disabled'} data-act="adj" data-m="${-v}">− abziehen</button><button class="btn" style="flex:1" ${v?'':'disabled'} data-act="adj" data-m="${v}">+ Bonus</button></div>`}
  if(S.sheet==='pair'){
    if(!S.pairRole)h=`<h3>Gerät koppeln</h3><p class="hint">Was für ein Gerät soll dazukommen? Die Rolle lässt sich später nicht ändern.</p><button class="li card" style="text-align:left" data-act="prole" data-r="kind"><div class="m"><div class="a">Kindgerät für Mia</div><div class="b">Ersetzt das aktuelle Kindgerät (Galaxy Tab A9). Eine laufende Sitzung läuft weiter.</div></div>›</button><button class="li card" style="text-align:left" data-act="prole" data-r="eltern"><div class="m"><div class="a">Elterngerät</div><div class="b">Kann Kontingente ändern und bekommt Benachrichtigungen.</div></div>›</button>`;
    else h=`<h3>${S.pairRole==='kind'?'Kindgerät für Mia':'Elterngerät'} koppeln</h3><p class="hint">Am neuen Gerät die App öffnen und den Code scannen oder abtippen.</p>${qrSvg()}<div class="code">K7Q-4MX</div><div class="hint num" style="text-align:center">Gültig noch ${mmss(S.pairT/60)} · einmalig</div><button class="btn text" data-act="close">Fertig</button>`}
  return `<div class="sheetwrap" data-act="closebg"><div class="sheet" data-stop="1"><div class="grab"></div>${h}</div></div>`}

/* ---------- Rahmen ---------- */
function render(){
  if(document.activeElement&&document.activeElement.matches('input[type=text]'))return;
  const ph=$('#phone');let scr='';
  if(S.role==='kind')scr=S.kScreen==='chk'?kidChecklist():({A:kidA,B:kidB,C:kidC})[S.v.kind]();
  else scr=({A:parA,B:parB,C:parC})[S.v.eltern]();
  const now=Date.now();
  const notif=S.role==='eltern'&&S.notif&&S.notif.until>now?`<div class="notif"><span class="ic">!</span><div><div style="font-weight:500">${S.notif.t}</div><div class="hint">${S.notif.b}</div></div></div>`:'';
  const snack=S.role==='kind'&&S.snack&&S.snack.until>now?`<div class="snack">♪ ${S.snack.t}</div>`:'';
  const r=rem();
  const alarm=S.role==='kind'&&S.alarmOn?`<div class="alarm"><div class="bell">⏰</div><h1>Zeit ist um!</h1><div>Bitte jetzt aufhören und Stopp drücken.</div><div class="ov">Überziehung +${mmss(r)}</div><button class="b1" data-act="stop">Stopp</button><button class="b2" data-act="silence">Ton aus · klingelt in 5 min wieder</button></div>`:'';
  const sc=ph.querySelector('.scroll'),top=sc?sc.scrollTop:0;
  ph.innerHTML=`<div class="statusbar num"><span>${hm(S.now)}</span><span>${S.offline?'✈ ':''}▮▮▮ 87%</span></div><div class="screen">${scr}${notif}${snack}${sheet()}${alarm}</div>`;
  const sc2=ph.querySelector('.scroll');if(sc2)sc2.scrollTop=top;
  renderSide();renderProto();
  try{history.replaceState(null,'','#'+S.role+'-'+S.v[S.role].toLowerCase())}catch(e){}
}
function renderProto(){const list=VARS[S.role],cur=S.v[S.role],name=list.find(x=>x[0]===cur)[1];
  $('#proto').innerHTML=`<button data-act="vprev" aria-label="Vorherige Variante">‹</button><span class="lbl">${S.role==='kind'?'Kindgerät':'Elterngerät'} · ${cur} (${name})</span><button data-act="vnext" aria-label="Nächste Variante">›</button><button class="role" data-act="role">${S.role==='kind'?'→ Eltern':'→ Kind'}</button>`}
function renderSide(){const s=st();
  $('#side').innerHTML=`<div class="panel"><h2>Simulation</h2><div class="prow"><span class="clock num">${hm(S.now)}</span><span class="tag ${s==='over'?'over':S.running?'run':''}">${stWord[s]}</span></div>
  <div class="prow">${[1,60,300].map(x=>`<button class="tog ${S.speed===x?'on':''}" data-act="speed" data-x="${x}">×${x}</button>`).join('')}<button class="tog" data-act="jump">+10 min</button></div>
  <div class="prow"><button class="tog ${S.offline?'on':''}" data-act="offline">Offline</button><button class="tog ${S.setupMissing?'on':''}" data-act="setup">Einrichtung fehlt</button></div>
  <div class="prow"><button class="tog" data-act="adj" data-m="15">Eltern: +15</button><button class="tog" data-act="adj" data-m="-15">Eltern: −15</button><button class="tog" data-act="reset">Zurücksetzen</button></div>
  <p>Tipp: Am Kindgerät starten, dann ×60. Nach etwa 20 s kommt die Vorwarnung, dann der Alarm. Danach aufs Elterngerät wechseln.</p></div>
  <div class="panel"><h2>Worauf achten</h2><p>Kind: Was ist auf einen Blick klar, auch aus zwei Metern? Wie fühlen sich Überziehung und „keine Zeit mehr“ an?<br>Eltern: Wie schnell ist „+15 Bonus“ gebucht? Wo gehören Wochenvorlage, Regeln und Geräte hin?</p><p>Gefällt ein Teil aus A und ein anderer aus C? Genau das ist die nützlichste Antwort.</p></div>`}

const INIT=JSON.parse(JSON.stringify(S));
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  if(el.dataset.act==='closebg'&&e.target.closest('[data-stop]'))return;
  const a=el.dataset.act,d=el.dataset;
  if(a!=='menu')S.menu=false;
  switch(a){
    case 'toggle':S.running?stop():start();return;
    case 'stop':stop();return;
    case 'silence':S.alarmOn=false;break;
    case 'kchk':S.kScreen='chk';break; case 'kback':S.kScreen='main';break;
    case 'adj':addAdj(+d.m);if(S.v.eltern==='B')S.customAdj=10;return;
    case 'undo':{const x=S.adj[+d.i];if(!x||S.offline)break;S.adj.push({min:-x.min,at:S.now,undo:true});x.undone=true;check();break}
    case 'tpl':{const i=+d.i;S.template[i]=Math.max(0,Math.min(600,S.template[i]+(+d.d)));break}
    case 'rule':{const k=d.k;S[k]=Math.max(k==='warnTh'?1:15,S[k]+(+d.d));break}
    case 'cadj':S.customAdj=Math.max(-120,Math.min(240,S.customAdj+(+d.d)));break;
    case 'pnav':S.pScreen=d.s;break;
    case 'menu':S.menu=!S.menu;break;
    case 'kid':S.kidOpen=true;S.pScreen='heute';break; case 'kidback':S.kidOpen=false;break;
    case 'sheet':S.sheet=d.s;S.pairRole=null;S.pairT=600;S.padVal='';if(d.s==='adj')S.customAdj=10;break;
    case 'close':S.sheet=null;break; case 'closebg':S.sheet=null;break;
    case 'prole':S.pairRole=d.r;break;
    case 'padk':S.padVal=d.k==='C'?'':d.k==='B'?S.padVal.slice(0,-1):(S.padVal+d.k).replace(/^0+/,'').slice(0,3);break;
    case 'unpair':S.devices=S.devices.filter(x=>x.id!==+d.id);break;
    case 'speed':S.speed=+d.x;break; case 'jump':S.now+=10;check();break;
    case 'offline':S.offline=!S.offline;if(S.offline)S.offlineSince=S.now;break;
    case 'setup':S.setupMissing=!S.setupMissing;break;
    case 'reset':Object.assign(S,JSON.parse(JSON.stringify(INIT)),{role:S.role,v:S.v});break;
    case 'role':S.role=S.role==='kind'?'eltern':'kind';S.sheet=null;break;
    case 'vprev':case 'vnext':{const l=VARS[S.role].map(x=>x[0]),i=l.indexOf(S.v[S.role]);S.v[S.role]=l[(i+(a==='vnext'?1:-1)+l.length)%l.length];S.pScreen='heute';S.kidOpen=false;S.sheet=null;S.kScreen='main';break}
  }
  render();
});
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,[contenteditable]'))return;
  if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();document.querySelector(`[data-act="${e.key==='ArrowRight'?'vnext':'vprev'}"]`).click()}});
(function(){const m=/^#(kind|eltern)-([abc])$/.exec(location.hash||'');if(m){S.role=m[1];S.v[m[1]]=m[2].toUpperCase()}})();
let last=Date.now(),down=false;
document.addEventListener('pointerdown',()=>down=true);document.addEventListener('pointerup',()=>setTimeout(()=>down=false,50));
document.addEventListener('change',e=>{const c=e.target.dataset&&e.target.dataset.chk;if(c){S.chk[c]=e.target.checked}});
setInterval(()=>{const t=Date.now(),dt=(t-last)/1000;last=t;S.now+=dt*S.speed/60;if(S.now>=1440)S.now=1439.9;if(S.sheet==='pair'&&S.pairRole)S.pairT=Math.max(0,S.pairT-dt);check();if(!down)render()},250);
render();
</script>
